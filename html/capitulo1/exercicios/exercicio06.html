<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Agenda de Contatos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
        Agenda de Contatos
    </h1>
    <div class="space-y-4">
        <input 
            id="nome"
            type="text"
            placeholder="Nome"
            class="w-full border p-3 rounded-lg"
        >
        <input 
            id="telefone"
            type="text"
            placeholder="Telefone"
            class="w-full border p-3 rounded-lg"
        >
        <button
            onclick="adicionar()"
            class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
            Adicionar Contato
        </button>
        <button
            onclick="listar()"
            class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700">
            Listar no Console
        </button>
    </div>
    <hr class="my-6">

    <h2 class="font-bold mb-3">
        Buscar contato
    </h2>
    <input 
        id="busca"
        type="text"
        placeholder="Digite um nome"
        class="w-full border p-3 rounded-lg mb-3"
    >
    <button
        onclick="buscar()"
        class="w-full bg-purple-600 text-white p-3 rounded-lg hover:bg-purple-700">
        Buscar
    </button>
</div>
<script type="module">

import { Agenda } from "./agenda.js";
import { Pessoa } from "./pessoa.js";
import { Contato } from "./contato.js";

const minhaAgenda = new Agenda();

window.adicionar = function(){
    const nome = document
        .getElementById("nome")
        .value;
    const telefone = document
        .getElementById("telefone")
        .value;
    const contato = new Contato(
        nome,
        telefone
    );
    const pessoa = new Pessoa(
        nome,
        contato
    );
    minhaAgenda.adicionarPessoa(pessoa);
    console.log("Pessoa adicionada!");
}

window.listar = function(){
    minhaAgenda.listarPessoas();
}

window.buscar = function(){
    const nome = document
        .getElementById("busca")
        .value;
    console.log("Busca por:", nome);
}
</script>
</body>
</html>
